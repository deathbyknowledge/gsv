[package]
name = "gsv-channel-whatsapp-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["js", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "Headers", "MessageEvent", "Request", "RequestInit", "Response", "WebSocket"] }
worker = { version = "0.8.3" }
worker-macros = { version = "0.8.3" }
whatsapp-rust = { version = "0.6.0", default-features = false }
wacore = { version = "0.6.0", default-features = false, features = ["js"] }
