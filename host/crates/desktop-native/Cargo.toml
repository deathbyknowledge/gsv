[package]
name = "desktop-native"
version.workspace = true
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
gesture-protocol = { path = "../gesture-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
