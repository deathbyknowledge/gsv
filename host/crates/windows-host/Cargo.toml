[package]
name = "windows-host"
version.workspace = true
edition = "2021"
publish = false

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory",
  "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
