[package]
name = "gesture-protocol"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
gesture-engine = { path = "../gesture-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
