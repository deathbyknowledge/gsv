[package]
name = "gestures"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
cameras = "=0.3.2"
crossbeam-channel = "0.5"
font8x8 = "0.3.1"
gesture-protocol = { path = "../../crates/gesture-protocol" }
libloading = "0.8.9"
minifb = "0.28.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gsv-vision"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
