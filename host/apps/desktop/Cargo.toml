[package]
name = "desktop"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
daemon-protocol = { path = "../../crates/daemon-protocol" }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
desktop-protocol = { path = "../../crates/desktop-protocol" }
gateway-client = { path = "../../crates/gateway-client" }
gesture-protocol = { path = "../../crates/gesture-protocol" }
host-config = { path = "../../crates/config" }
image = "=0.25.10"
dirs = "5"
hostname = "0.4.2"
infer = { version = "0.16", default-features = false }
markdown = "=1.0.0"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
resvg = { version = "=0.45.1", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tempfile = "3"
url = "2"
unicode-segmentation = "1"
usvg = "=0.45.1"
uuid = { version = "1", features = ["v4"] }
visual-engine = { path = "../../crates/visual-engine" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", features = ["blocking"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[[bin]]
name = "gsv-desktop"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
