[package]
name = "desktop"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
desktop-protocol = { path = "../../crates/desktop-protocol" }
gateway-client = { path = "../../crates/gateway-client" }
gesture-protocol = { path = "../../crates/gesture-protocol" }
host-config = { path = "../../crates/config" }
image = "=0.25.10"
infer = { version = "0.16", default-features = false }
markdown = "=1.0.0"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tempfile = "3"
url = "2"
unicode-segmentation = "1"
usvg = "=0.45.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
enigo = { version = "=0.6.1", features = ["wayland"] }
libc = "0.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[[bin]]
name = "gsv-desktop"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
