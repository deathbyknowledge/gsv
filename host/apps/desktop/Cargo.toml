[package]
name = "desktop"
version.workspace = true
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
fs2 = "0.4"
async-trait = "0.1"
desktop-protocol = { path = "../../crates/desktop-protocol" }
desktop-native = { path = "../../crates/desktop-native" }
gesture-protocol = { path = "../../crates/gesture-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.11.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
desktop-native = { path = "../../crates/desktop-native", features = ["test-support"] }

[[bin]]
name = "gsv-desktop"
path = "src/main.rs"
