[workspace]
members = [
    "apps/*",
    "crates/*",
    "helpers/*",
]
resolver = "2"

[workspace.package]
version = "0.6.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package.gestures]
opt-level = 3
debug-assertions = false
overflow-checks = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
codegen-units = 1
