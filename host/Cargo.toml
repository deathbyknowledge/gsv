[workspace]
members = [
    "apps/*",
    "crates/*",
    "helpers/*",
]
resolver = "2"
exclude = ["helpers/speaker"]

[workspace.package]
version = "0.7.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
codegen-units = 1
