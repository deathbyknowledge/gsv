name: Publish Public Packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish every new public package version to npm
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-public-packages
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate publishable packages
        run: npm run public-packages:check

      - name: Publish new package versions
        run: node scripts/publish-public-packages.mjs --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
