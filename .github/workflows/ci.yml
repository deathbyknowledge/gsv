name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/zen-fleet]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.filter.outputs.version }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      gateway: ${{ steps.filter.outputs.gateway }}
      installations: ${{ steps.filter.outputs.installations }}
      inference: ${{ steps.filter.outputs.inference }}
      deployment: ${{ steps.filter.outputs.deployment }}
      deletion_stack: ${{ steps.filter.outputs.deletion_stack }}
      adapters: ${{ steps.filter.outputs.adapters }}
      ripgit: ${{ steps.filter.outputs.ripgit }}
      cli: ${{ steps.filter.outputs.cli }}
      machine: ${{ steps.filter.outputs.machine }}
      desktop: ${{ steps.filter.outputs.desktop }}
      host_crates: ${{ steps.filter.outputs.host_crates }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect affected components
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            version:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'VERSION'
              - 'host/Cargo.toml'
              - 'host/Cargo.lock'
              - 'scripts/version.mjs'
              - 'scripts/test-host-installer.sh'
              - 'install.sh'
              - 'install.ps1'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/package.json'
              - 'host/apps/*/Cargo.toml'
              - 'host/crates/*/Cargo.toml'
              - 'host/helpers/*/Cargo.toml'
              - 'extension/package.json'
              - 'extension/public/manifest.json'
              - 'extension/src/background/service-worker.ts'
              - 'extension/src/target/network-recorder.ts'
              - 'workers/gateway/package.json'
              - 'workers/gateway/package-lock.json'
              - 'workers/gateway/src/version.ts'
              - 'workers/gateway/src/kernel/config.ts'
              - 'workers/gateway/src/drivers/native/shell.test.ts'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'web/src/app/services/gateway/GatewayProvider.tsx'
              - 'web/src/app/services/session/sessionService.ts'
              - 'workers/ripgit/package.json'
              - 'workers/ripgit/package-lock.json'
              - 'workers/ripgit/Cargo.toml'
              - 'workers/ripgit/Cargo.lock'
              - 'workers/ripgit/src/lib.rs'
              - 'workers/adapters/*/package.json'
              - 'workers/adapters/*/package-lock.json'
            sdk:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
            web:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'web/**'
            extension:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'extension/**'
            gateway:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'packages/inference/**'
              - 'workers/gateway/**'
              - 'workers/inference/**'
              - 'workers/adapters/shared/**'
              - 'workers/adapters/telegram/**'
              - 'workers/adapters/slack/**'
              - 'workers/adapters/discord/**'
            inference:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'packages/inference/**'
              - 'workers/inference/**'
            installations:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'workers/installations/**'
            deployment:
              - '.github/workflows/ci.yml'
              - '.github/workflows/preview*.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'alchemy.run.ts'
              - 'preview*.alchemy.ts'
              - 'deployment/**'
              - 'scripts/capture-ai-gateway-logs.ts'
              - 'scripts/build-cloudflare-bundles.sh'
              - 'scripts/build-deployment-manifest.mjs'
              - 'scripts/adapter-catalog.mjs'
              - 'scripts/normalize-worker-text-modules.mjs'
              - 'workers/adapters/*/adapter.json'
              - 'workers/installations/migrations/**'
            deletion_stack:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'packages/inference/**'
              - 'deployment/**'
              - 'workers/installations/**'
              - 'workers/inference/**'
              - 'workers/gateway/**'
              - 'workers/adapters/email/**'
              - 'workers/ripgit/**'
              - 'scripts/worker-build.sh'
            adapters:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'workers/adapters/**'
            ripgit:
              - '.github/workflows/ci.yml'
              - 'scripts/worker-build.sh'
              - 'workers/ripgit/**'
            cli:
              - '.github/workflows/ci.yml'
              - 'host/Cargo.toml'
              - 'host/Cargo.lock'
              - 'host/apps/cli/**'
              - 'host/crates/gateway-client/**'
              - 'host/crates/config/**'
              - 'host/crates/desktop-protocol/**'
            machine:
              - '.github/workflows/ci.yml'
              - 'host/Cargo.toml'
              - 'host/Cargo.lock'
              - 'host/apps/machine/**'
              - 'host/crates/gateway-client/**'
              - 'host/crates/config/**'
            desktop:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'host/Cargo.toml'
              - 'host/Cargo.lock'
              - 'host/apps/desktop/**'
              - 'host/crates/desktop-native/**'
              - 'host/helpers/**'
              - 'host/packaging/**'
              - 'host/scripts/**'
              - 'scripts/vision-native/**'
              - 'host/crates/gateway-client/**'
              - 'host/crates/config/**'
              - 'host/crates/desktop-protocol/**'
              - 'host/crates/gesture-protocol/**'
              - 'web/**'
              - 'packages/gsv/**'
              - 'package*.json'
            host_crates:
              - '.github/workflows/ci.yml'
              - 'host/Cargo.toml'
              - 'host/Cargo.lock'
              - 'host/crates/**'

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.version == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify synced versions
        run: npm run version:check

  lint:
    name: TypeScript and JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Oxlint and anti-slop
        run: npm run lint

  release-scripts-check:
    name: Release Scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.version == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test Unix installer
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh scripts/test-host-installer.sh
          ./scripts/test-host-installer.sh

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  workspace-check:
    name: Workspace Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.installations == 'true' ||
      needs.changes.outputs.inference == 'true' ||
      needs.changes.outputs.deployment == 'true' ||
      needs.changes.outputs.deletion_stack == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check GSV package
        if: needs.changes.outputs.sdk == 'true'
        run: npm run gsv:check

      - name: Test GSV package
        if: needs.changes.outputs.sdk == 'true'
        run: npm test --workspace packages/gsv

      - name: Check web shell
        if: needs.changes.outputs.web == 'true'
        run: npm run check --workspace web

      - name: Check shared inference runtime
        if: needs.changes.outputs.inference == 'true'
        run: npm run typecheck --workspace @humansandmachines/gsv-inference

      - name: Test shared inference runtime
        if: needs.changes.outputs.inference == 'true'
        run: npm test --workspace @humansandmachines/gsv-inference

      - name: Check public inference Worker
        if: needs.changes.outputs.inference == 'true'
        run: npm run typecheck --workspace @humansandmachines/gsv-inference-worker

      - name: Test public inference Worker
        if: needs.changes.outputs.inference == 'true'
        run: npm test --workspace @humansandmachines/gsv-inference-worker

      - name: Check installation services
        if: needs.changes.outputs.installations == 'true'
        run: npm run typecheck --workspace @humansandmachines/gsv-installations

      - name: Test installation services
        if: needs.changes.outputs.installations == 'true'
        run: npm test --workspace @humansandmachines/gsv-installations

      - name: Check deployment package
        if: needs.changes.outputs.deployment == 'true'
        run: npm run deployment:check

      - name: Test deployment package
        if: needs.changes.outputs.deployment == 'true'
        run: npm test --workspace deployment

      - name: Test web shell
        if: needs.changes.outputs.web == 'true'
        run: npm run test:run --workspace web

      - name: Build web shell
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.deletion_stack == 'true'
        run: npm run build --workspace web

      - name: Install Rust for deletion acceptance
        if: needs.changes.outputs.deletion_stack == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install mail dependencies for deletion acceptance
        if: needs.changes.outputs.deletion_stack == 'true'
        working-directory: workers/adapters/email
        run: npm ci --no-audit --no-fund

      - name: Cache ripgit build for deletion acceptance
        if: needs.changes.outputs.deletion_stack == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: workers/ripgit
          key: deletion-acceptance

      - name: Build ripgit for deletion acceptance
        if: needs.changes.outputs.deletion_stack == 'true'
        run: bash scripts/worker-build.sh workers/ripgit --release

      # Local Workers prove live isolation/erasure; fresh-account and backup-retention gates remain separate.
      - name: Test public two-space deletion
        if: needs.changes.outputs.deletion_stack == 'true'
        run: npx vitest run --config deployment/test/deletion-stack.vitest.config.ts

      - name: Check browser extension
        if: needs.changes.outputs.extension == 'true'
        run: npm run extension:check

      - name: Build browser extension
        if: needs.changes.outputs.extension == 'true'
        run: npm run extension:build

  gateway-test:
    name: Gateway Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      GSV_TEST_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALCHEMY_CI_STATE_STORE_CHECK: "false"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Type check
        run: npm exec --workspace gateway -- tsc --noEmit
      
      - name: Run gateway tests
        run: npm run test:run --workspace gateway

  ripgit-test:
    name: Ripgit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ripgit == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/ripgit/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: workers/ripgit
        run: npm ci --no-audit --no-fund

      - name: Run Rust unit tests
        working-directory: workers/ripgit
        run: cargo test

      - name: Bundle worker
        working-directory: workers/ripgit
        run: npm exec -- wrangler deploy --minify --dry-run --outdir dist/worker

  adapter-packages:
    name: Adapter Package Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.adapters == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/adapters/*/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install adapter dependencies
        # Installs skip the audit call: the advisories endpoint can hang for a
        # full fetch timeout, which turned six small installs into 23 minutes.
        run: |
          set -euo pipefail
          for manifest in workers/adapters/*/package.json; do
            directory="${manifest%/package.json}"
            (cd "$directory" && npm ci --no-audit --no-fund)
          done

      - name: Type check adapter packages
        run: |
          set -euo pipefail
          for manifest in workers/adapters/*/package.json; do
            directory="${manifest%/package.json}"
            npm --prefix "$directory" run typecheck
          done

      - name: Run shared adapter tests
        run: npm exec -- vitest run workers/adapters/shared/test

      - name: Run adapter package tests
        run: |
          set -euo pipefail
          for manifest in workers/adapters/*/package.json; do
            directory="${manifest%/package.json}"
            test_script="$(node -e '
              const scripts = require("./" + process.argv[1]).scripts ?? {};
              console.log(
                scripts["test:run"] ? "test:run"
                  : scripts["test:managed"] ? "test:managed"
                    : scripts.test ? "test" : "",
              );
            ' "$manifest")"
            if [ -n "$test_script" ]; then
              npm --prefix "$directory" run "$test_script"
            fi
          done

  cli-build:
    name: CLI Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.cli == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Build
        working-directory: host
        run: cargo build --locked --release --package gsv

      - name: Check formatting
        working-directory: host
        run: cargo fmt --package gsv --check
      
      - name: Run tests
        working-directory: host
        run: cargo test --locked --package gsv

  host-crates:
    name: Host Rust Crates
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.host_crates == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: host
        run: >-
          cargo fmt --package gateway-client --package host-config
          --package daemon-protocol --package desktop-protocol
          --package gesture-protocol --check

      - name: Test shared crates
        working-directory: host
        run: >-
          cargo test --locked --package gateway-client --package host-config
          --package daemon-protocol --package desktop-protocol
          --package gesture-protocol

      - name: Lint shared crates
        working-directory: host
        run: >-
          cargo clippy --locked --package gateway-client --package host-config
          --package daemon-protocol --package desktop-protocol
          --package gesture-protocol --all-targets -- -D warnings

  machine-build:
    name: Machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.machine == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check machine
        working-directory: host
        run: cargo check --locked --package machine

      - name: Check formatting
        working-directory: host
        run: cargo fmt --package machine --check

      - name: Test machine
        working-directory: host
        run: cargo test --locked --package machine

      - name: Lint machine
        working-directory: host
        run: cargo clippy --locked --package machine --all-targets -- -D warnings

  desktop-build:
    name: Desktop (Linux)
    runs-on: ubuntu-22.04
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: host -> target
          cache-on-failure: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libv4l-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            linux-libc-dev \
            patchelf \
            pkg-config

      - name: Cache native compiler output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gsv-desktop-ccache
          key: desktop-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: desktop-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure native compiler cache
        run: |
          printf '%s\n' \
            "CCACHE_DIR=$RUNNER_TEMP/gsv-desktop-ccache" \
            "CCACHE_BASEDIR=$GITHUB_WORKSPACE" \
            'CCACHE_COMPILERCHECK=content' \
            'CCACHE_MAXSIZE=512M' \
            'CMAKE_C_COMPILER_LAUNCHER=ccache' \
            'CMAKE_CXX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
          CCACHE_DIR="$RUNNER_TEMP/gsv-desktop-ccache" ccache --zero-stats

      - name: Check vision artifact scripts
        run: |
          bash -n host/scripts/package-macos.sh
          bash -n scripts/vision-native/benchmark.sh
          bash -n scripts/vision-native/fixtures.sh
          bash -n scripts/vision-native/parity.sh
          bash -n scripts/vision-native/update-models.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build shared desktop frontend
        run: |
          npm ci --ignore-scripts --workspace web --workspace packages/gsv --include-workspace-root=false
          npm run gsv:build
          npm run build --workspace web -- --config vite.desktop.config.ts
          npm run test:run --workspace web -- src/desktop src/app/services/platform

      - name: Check formatting
        working-directory: host
        run: >-
          cargo fmt --package desktop --package desktop-native --package transcriber
          --package gestures --package gesture-protocol --check

      - name: Test Desktop and helpers
        working-directory: host
        run: |
          cargo test --locked --package desktop --package desktop-native --package transcriber \
            --package gestures --package gesture-protocol
          ccache --show-stats --verbose

      - name: Check public gesture fixtures and tracking recovery
        working-directory: host
        run: >-
          ../scripts/vision-native/parity.sh --profile test
          --package desktop --package desktop-native --package transcriber --package gestures --package gesture-protocol

      - name: Lint Desktop and helpers
        working-directory: host
        run: |
          ccache --zero-stats
          cargo clippy --locked --package desktop --package desktop-native --package transcriber \
            --package gestures --package gesture-protocol --all-targets -- -D warnings
          ccache --show-stats --verbose
