name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.filter.outputs.version }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      gateway: ${{ steps.filter.outputs.gateway }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      ripgit: ${{ steps.filter.outputs.ripgit }}
      cli: ${{ steps.filter.outputs.cli }}
      daemon: ${{ steps.filter.outputs.daemon }}
      native: ${{ steps.filter.outputs.native }}
      rust_shared: ${{ steps.filter.outputs.rust_shared }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect affected components
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            version:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'VERSION'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/version.mjs'
              - 'scripts/test-host-installer.sh'
              - 'install.sh'
              - 'install.ps1'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/package.json'
              - 'cli/Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'daemon/Cargo.toml'
              - 'native/Cargo.toml'
              - 'native/transcribe-helper/Cargo.toml'
              - 'native/vision-helper/Cargo.toml'
              - 'extension/package.json'
              - 'extension/public/manifest.json'
              - 'extension/src/background/service-worker.ts'
              - 'extension/src/target/network-recorder.ts'
              - 'gateway/package.json'
              - 'gateway/package-lock.json'
              - 'gateway/src/version.ts'
              - 'gateway/src/kernel/config.ts'
              - 'gateway/src/drivers/native/shell.test.ts'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'web/src/app/services/gateway/GatewayProvider.tsx'
              - 'web/src/app/services/session/sessionService.ts'
              - 'ripgit/package.json'
              - 'ripgit/package-lock.json'
              - 'ripgit/Cargo.toml'
              - 'ripgit/Cargo.lock'
              - 'ripgit/src/lib.rs'
              - 'adapters/*/package.json'
              - 'adapters/*/package-lock.json'
            sdk:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
            web:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'web/**'
            extension:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'extension/**'
            gateway:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'gateway/**'
            whatsapp:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/gsv/**'
              - 'adapters/shared/**'
              - 'adapters/whatsapp/**'
              - 'scripts/build-cloudflare-bundles.sh'
              - 'scripts/check-worker-bundle-size.mjs'
            ripgit:
              - '.github/workflows/ci.yml'
              - 'scripts/worker-build.sh'
              - 'ripgit/**'
            cli:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cli/**'
              - 'crates/gsv-client/**'
              - 'crates/gsv-config/**'
              - 'crates/gsv-desktop-control/**'
            daemon:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'daemon/**'
              - 'crates/gsv-client/**'
              - 'crates/gsv-config/**'
            native:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'native/**'
              - 'scripts/vision-mediapipe/**'
              - 'crates/gsv-client/**'
              - 'crates/gsv-config/**'
              - 'crates/gsv-desktop-control/**'
              - 'web/public/fonts/**'
            rust_shared:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.version == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify synced versions
        run: npm run version:check

  release-scripts-check:
    name: Release Scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.version == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test Unix installer
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh scripts/test-host-installer.sh
          ./scripts/test-host-installer.sh

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  workspace-check:
    name: Workspace Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.extension == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check GSV package
        if: needs.changes.outputs.sdk == 'true'
        run: npm run gsv:check

      - name: Test GSV package
        if: needs.changes.outputs.sdk == 'true'
        run: npm test --workspace packages/gsv

      - name: Check web shell
        if: needs.changes.outputs.web == 'true'
        run: npm run check --workspace web

      - name: Test web shell
        if: needs.changes.outputs.web == 'true'
        run: npm run test:run --workspace web

      - name: Build web shell
        if: needs.changes.outputs.web == 'true'
        run: npm run build --workspace web

      - name: Check browser extension
        if: needs.changes.outputs.extension == 'true'
        run: npm run extension:check

      - name: Build browser extension
        if: needs.changes.outputs.extension == 'true'
        run: npm run extension:build

  gateway-test:
    name: Gateway Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      GSV_TEST_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALCHEMY_CI_STATE_STORE_CHECK: "false"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm exec --workspace gateway -- tsc --noEmit
      
      - name: Run gateway tests
        run: npm run test:run --workspace gateway

  ripgit-test:
    name: Ripgit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ripgit == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ripgit/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: ripgit
        run: npm ci

      - name: Run Rust unit tests
        working-directory: ripgit
        run: cargo test

      - name: Bundle worker
        working-directory: ripgit
        run: npm exec -- wrangler deploy --minify --dry-run --outdir dist/worker

  whatsapp-test:
    name: WhatsApp Adapter Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.whatsapp == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            adapters/whatsapp/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install WhatsApp adapter dependencies
        working-directory: adapters/whatsapp
        run: npm ci

      - name: Type check WhatsApp adapter
        working-directory: adapters/whatsapp
        run: npm exec -- tsc --noEmit

      - name: Run shared and WhatsApp adapter tests
        run: npm exec -- vitest run adapters/shared/test adapters/whatsapp

      - name: Bundle WhatsApp worker
        working-directory: adapters/whatsapp
        run: npm exec -- wrangler deploy --minify --dry-run --outdir dist/worker

      - name: Enforce Workers Free bundle budget
        run: node scripts/check-worker-bundle-size.mjs adapters/whatsapp/dist/worker/index.js 2800000

  cli-build:
    name: CLI Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.cli == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Build
        run: cargo build --locked --release --package gsv

      - name: Check formatting
        run: cargo fmt --package gsv --check
      
      - name: Run tests
        run: cargo test --locked --package gsv

  rust-shared:
    name: Shared Rust Contracts
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust_shared == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: >-
          cargo fmt --package gsv-client --package gsv-config
          --package gsv-desktop-control --check

      - name: Test shared crates
        run: >-
          cargo test --locked --package gsv-client --package gsv-config
          --package gsv-desktop-control

      - name: Lint shared crates
        run: >-
          cargo clippy --locked --package gsv-client --package gsv-config
          --package gsv-desktop-control --all-targets -- -D warnings

  daemon-build:
    name: Device Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.daemon == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check daemon
        run: cargo check --locked --package gsvd

      - name: Check formatting
        run: cargo fmt --package gsvd --check

      - name: Test daemon
        run: cargo test --locked --package gsvd

      - name: Lint daemon
        run: cargo clippy --locked --package gsvd --all-targets -- -D warnings

  native-build:
    name: Native Desktop (Linux)
    runs-on: ubuntu-22.04
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libfontconfig1-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            linux-libc-dev \
            patchelf \
            pkg-config

      - name: Check vision artifact script
        run: bash -n scripts/vision-mediapipe/build-linux.sh

      - name: Check Desktop and helpers
        run: >-
          cargo check --locked --package gsv-native --package gsv-transcribe
          --package gsv-vision

      - name: Check formatting
        run: >-
          cargo fmt --package gsv-native --package gsv-transcribe
          --package gsv-vision --check

      - name: Test Desktop and helpers
        run: >-
          cargo test --locked --package gsv-native --package gsv-transcribe
          --package gsv-vision

      - name: Lint Desktop and helpers
        run: >-
          cargo clippy --locked --package gsv-native --package gsv-transcribe
          --package gsv-vision --all-targets -- -D warnings
