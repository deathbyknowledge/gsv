name: GSV Preview Cleanup

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: vars.GSV_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: gsv-previews
    permissions:
      contents: read
      pull-requests: read
    outputs:
      numbers: ${{ steps.closed.outputs.numbers }}
    steps:
      # Never fetch or execute PR code in this privileged close/scheduled workflow.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install trusted inventory dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read registered previews
        env:
          GSV_PREVIEW_REPOSITORY_ID: ${{ github.repository_id }}
          ALCHEMY_STATE_URL: ${{ vars.GSV_PREVIEW_STATE_URL }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.GSV_PREVIEW_STATE_TOKEN }}
        run: node scripts/preview-cloud.mjs list > "$RUNNER_TEMP/gsv-preview-numbers.json"
      - id: closed
        name: Select only currently closed pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview-github.mjs closed "$RUNNER_TEMP/gsv-preview-numbers.json"

  cleanup:
    needs: inventory
    if: needs.inventory.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: gsv-previews
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        number: ${{ fromJSON(needs.inventory.outputs.numbers) }}
    concurrency:
      group: gsv-preview-${{ github.repository_id }}-${{ matrix.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      GSV_PREVIEW_NUMBER: ${{ matrix.number }}
      GSV_PREVIEW_REPOSITORY_ID: ${{ github.repository_id }}
      GSV_ALLOW_RESOURCE_DELETION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install trusted cleanup dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: current
        name: Recheck closure after acquiring deployment lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GSV_PREVIEW_ACTION: destroy
        run: node scripts/preview-github.mjs resolve
      - name: Delete and verify registered preview resources
        if: steps.current.outputs.eligible == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.GSV_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.GSV_PREVIEW_CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_URL: ${{ vars.GSV_PREVIEW_STATE_URL }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.GSV_PREVIEW_STATE_TOKEN }}
          GSV_PREVIEW_R2_ACCESS_KEY_ID: ${{ secrets.GSV_PREVIEW_R2_ACCESS_KEY_ID }}
          GSV_PREVIEW_R2_SECRET_ACCESS_KEY: ${{ secrets.GSV_PREVIEW_R2_SECRET_ACCESS_KEY }}
        run: node scripts/preview-cloud.mjs destroy
      - name: Mark preview removed
        if: steps.current.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GSV_PREVIEW_STATUS: deleted
        run: node scripts/preview-github.mjs publish
