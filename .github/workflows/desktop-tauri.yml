name: isolated tauri prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-tauri.yml'
      - 'host/apps/desktop-tauri/**'
      - 'host/Cargo.*'
      - 'host/crates/desktop-native/**'
      - 'host/crates/gesture-protocol/**'
      - 'host/helpers/**'
      - 'web/src/desktop/**'
      - 'web/src/app/services/platform/**'
      - 'web/vite.desktop.config.ts'

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Install native build libraries and media runtime
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libssl-dev libclang-dev libv4l-dev libwayland-dev libxkbcommon-dev libx11-dev cmake gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-tools
      - name: Check required WebKit media plugins
        run: |
          gst-inspect-1.0 --exists appsink
          gst-inspect-1.0 --exists appsrc
          gst-inspect-1.0 --exists autoaudiosink
      - name: Build shared frontend
        run: |
          npm ci --ignore-scripts --workspace web --workspace packages/gsv --include-workspace-root=false
          npm run gsv:build
          npm run build --workspace web -- --config vite.desktop.config.ts
      - name: Check shared frontend and boundary tests
        run: |
          npm run check --workspace web
          npm run test:run --workspace web
      - name: Native boundary tests
        run: cargo test --manifest-path host/Cargo.toml --locked --package desktop-native --package desktop-tauri --features custom-protocol
      - name: Build prototype and matching helpers
        run: cargo build --manifest-path host/Cargo.toml --locked --package desktop-tauri --package transcriber --package gestures --features custom-protocol
      - name: Stage isolated executable archive
        run: |
          mkdir -p release/local/tauri-prototype/licenses/gesture-models
          cp host/target/debug/gsv-desktop-tauri host/target/debug/gsv-transcribe host/target/debug/gsv-vision release/local/tauri-prototype/
          cp host/helpers/transcriber/THIRD_PARTY.md host/apps/desktop-tauri/README.md LICENSE release/local/tauri-prototype/
          cp host/helpers/gestures/models/LICENSE.apache-2.0 host/helpers/gestures/models/PROVENANCE.md release/local/tauri-prototype/licenses/gesture-models/
          cp host/helpers/gestures/THIRD_PARTY.md release/local/tauri-prototype/licenses/gesture-models/
          cd release/local/tauri-prototype
          sha256sum gsv-desktop-tauri gsv-transcribe gsv-vision > SHA256SUMS
          tar -czf ../gsv-tauri-prototype-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: gsv-tauri-prototype-linux-x64
          path: release/local/gsv-tauri-prototype-linux-x64.tar.gz
