name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve which channel we're building for
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      kind: ${{ steps.channel.outputs.kind }}
      short_sha: ${{ steps.channel.outputs.short_sha }}
      release_tag: ${{ steps.channel.outputs.release_tag }}
      release_name: ${{ steps.channel.outputs.release_name }}
      built_at: ${{ steps.channel.outputs.built_at }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify synced versions
        run: npm run version:check

      - name: Resolve release
        id: channel
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(npm run --silent version:show)"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            KIND="stable"
          else
            KIND="dev"
          fi

          if [ "$KIND" = "stable" ]; then
            EXPECTED_TAG="$(node ./scripts/release.mjs stable-tag)"
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RELEASE_TAG="${GITHUB_REF_NAME}"
            else
              RELEASE_TAG="$EXPECTED_TAG"
            fi
            if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
              echo "Stable release tag must match ${EXPECTED_TAG}, got ${RELEASE_TAG}" >&2
              exit 1
            fi
            RELEASE_NAME="GSV ${RELEASE_TAG}"
            PRERELEASE="false"
          else
            RELEASE_TAG="$(node ./scripts/release.mjs dev-tag)"
            RELEASE_NAME="GSV (dev)"
            PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # Build the operator CLI and machine daemon as a same-version pair.
  build-host-tools:
    needs: [resolve]
    env:
      GSV_BUILD_CHANNEL: ${{ needs.resolve.outputs.kind }}
      GSV_BUILD_SHA: ${{ github.sha }}
      GSV_BUILD_RUN_NUMBER: ${{ github.run_number }}
      GSV_BUILD_TAG: ${{ needs.resolve.outputs.release_tag }}
      GSV_BUILD_TIMESTAMP: ${{ needs.resolve.outputs.built_at }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build host tools (Linux, rustls)
        if: runner.os == 'Linux'
        working-directory: host
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package gsv --package machine --no-default-features
          --features gsv/rustls,machine/rustls

      - name: Build host tools (native TLS)
        if: runner.os != 'Linux'
        working-directory: host
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package gsv --package machine

      - name: Stage host tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "host/target/${{ matrix.target }}/release/gsv${suffix}" "release/gsv-${{ matrix.platform }}${suffix}"
          cp "host/target/${{ matrix.target }}/release/gsvd${suffix}" "release/gsvd-${{ matrix.platform }}${suffix}"

      - name: Upload host tools
        uses: actions/upload-artifact@v4
        with:
          name: gsv-host-tools-${{ matrix.platform }}
          path: release/*

  # GPUI 0.2.2 supports Linux and macOS. Build Desktop and its isolated
  # transcription helper natively for both architectures on those systems.
  build-desktop:
    needs: [resolve]
    env:
      GSV_BUILD_CHANNEL: ${{ needs.resolve.outputs.kind }}
      GSV_BUILD_SHA: ${{ github.sha }}
      GSV_BUILD_RUN_NUMBER: ${{ github.run_number }}
      GSV_BUILD_TAG: ${{ needs.resolve.outputs.release_tag }}
      GSV_BUILD_TIMESTAMP: ${{ needs.resolve.outputs.built_at }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Build Desktop and transcription helper
        working-directory: host
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --package desktop --package transcriber

      - name: Stage Desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "host/target/${{ matrix.target }}/release/gsv-desktop" "release/gsv-desktop-${{ matrix.platform }}"
          cp "host/target/${{ matrix.target }}/release/gsv-transcribe" "release/gsv-transcribe-${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            cp host/helpers/transcriber/THIRD_PARTY.md release/gsv-transcribe-THIRD_PARTY.md
          fi

      - name: Upload Desktop
        uses: actions/upload-artifact@v4
        with:
          name: gsv-desktop-${{ matrix.platform }}
          path: release/*

  # Build pre-bundled Cloudflare deployment artifacts.
  build-cloudflare-bundles:
    needs: [resolve]
    runs-on: ubuntu-latest
    env:
      GSV_RELEASE_REF: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
            web/package-lock.json
            ripgit/package-lock.json
            adapters/whatsapp/package-lock.json
            adapters/discord/package-lock.json
            adapters/telegram/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Cloudflare bundles
        run: |
          set -euo pipefail
          npm run release:build:cloudflare -- "$GITHUB_WORKSPACE/release"

      - name: Upload Cloudflare bundles
        uses: actions/upload-artifact@v4
        with:
          name: gsv-cloudflare-bundles
          path: |
            release/gsv-cloudflare-*.tar.gz
            release/gsv-cloudflare-deployment-manifest.json
            release/cloudflare-checksums.txt

  build-browser-extension:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build browser extension package
        run: npm run extension:package -- "$GITHUB_WORKSPACE/release"

      - name: Upload browser extension package
        uses: actions/upload-artifact@v4
        with:
          name: gsv-browser-extension
          path: release/gsv-browser-extension.zip

  # Create GitHub Release with all artifacts
  release:
    needs: [resolve, build-host-tools, build-desktop, build-cloudflare-bundles, build-browser-extension]
    runs-on: ubuntu-latest
    env:
      KIND: ${{ needs.resolve.outputs.kind }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
      BUILT_AT: ${{ needs.resolve.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Operator CLI and machine daemon
          cp artifacts/gsv-host-tools-linux-x64/* release/
          cp artifacts/gsv-host-tools-linux-arm64/* release/
          cp artifacts/gsv-host-tools-darwin-x64/* release/
          cp artifacts/gsv-host-tools-darwin-arm64/* release/
          cp artifacts/gsv-host-tools-windows-x64/* release/

          # Desktop and isolated local transcription helper
          cp artifacts/gsv-desktop-linux-x64/* release/
          cp artifacts/gsv-desktop-linux-arm64/* release/
          cp artifacts/gsv-desktop-darwin-x64/* release/
          cp artifacts/gsv-desktop-darwin-arm64/* release/

          # Cloudflare deploy bundles (modular, per component/adapter)
          cp artifacts/gsv-cloudflare-bundles/gsv-cloudflare-*.tar.gz release/
          cp artifacts/gsv-cloudflare-bundles/gsv-cloudflare-deployment-manifest.json release/
          cp artifacts/gsv-cloudflare-bundles/cloudflare-checksums.txt release/

          # Browser extension
          cp artifacts/gsv-browser-extension/gsv-browser-extension.zip release/

          # Make binaries executable
          chmod +x release/gsv-linux-* release/gsvd-linux-* \
            release/gsv-darwin-* release/gsvd-darwin-* \
            release/gsv-desktop-* release/gsv-transcribe-linux-* \
            release/gsv-transcribe-darwin-*
          chmod -x release/gsv-transcribe-THIRD_PARTY.md

          # Include install script
          cp install.sh release/
          cp install.ps1 release/

          # Create checksums
          cd release
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Build release body
        id: body
        run: |
          if [ "$KIND" = "stable" ]; then
            TITLE="${RELEASE_NAME}"
            INSTALL_CMD='curl -fsSL https://install.gsv.space | bash'
            INSTALL_CMD_PS='irm https://install.gsv.space/install.ps1 | iex'
            DEV_CHANNEL_NOTE=""
          else
            TITLE="${RELEASE_NAME}"
            INSTALL_CMD='curl -fsSL https://install.gsv.space | GSV_CHANNEL=dev bash'
            INSTALL_CMD_PS='$env:GSV_CHANNEL="dev"; irm https://install.gsv.space/install.ps1 | iex'
            DEV_CHANNEL_NOTE=$(cat <<'DEV_NOTE'
          ### Dev Channel

          `dev` is a moving prerelease channel that always tracks the latest commit on `main`.
          For an immutable release, install a versioned `v*.*.*` tag instead.
          DEV_NOTE
            )
          fi
          INSTALL_TAG_CMD_PS="\$env:GSV_VERSION='${RELEASE_TAG}'; irm https://install.gsv.space/install.ps1 | iex"

          cat > body.md <<BODY
          ## ${TITLE}

          **Commit:** \`${SHORT_SHA}\` · **Built:** ${BUILT_AT} · **Release tag:** \`${RELEASE_TAG}\`

          ### Installation

          \`\`\`bash
          ${INSTALL_CMD}
          \`\`\`

          \`\`\`powershell
          ${INSTALL_CMD_PS}
          \`\`\`

          Pin a specific release tag:

          \`\`\`bash
          curl -fsSL https://install.gsv.space | GSV_VERSION=${RELEASE_TAG} bash
          \`\`\`

          \`\`\`powershell
          ${INSTALL_TAG_CMD_PS}
          \`\`\`

          ${DEV_CHANNEL_NOTE}

          ### Cloudflare Bundles

          Cloudflare artifacts are split into component archives. The
          checksum-verified \`gsv-cloudflare-deployment-manifest.json\` describes
          the runtime and every bundled adapter, so deployment tools do not need
          a hardcoded adapter list.

          ### Browser Extension

          Download \`gsv-browser-extension.zip\`, unzip it, and load the extracted directory as an unpacked extension from the browser extensions page.

          ### Host applications

          The installer verifies every downloaded artifact, replaces \`gsv\`, \`gsvd\`,
          Desktop, and the transcription helper as one versioned set, and migrates an
          existing device service to execute \`gsvd --foreground\` directly. Linux and
          macOS receive Desktop; Windows currently receives the CLI and daemon only.

          ### Manual Installation

          Download the binary for your platform:
          - **macOS (Apple Silicon)**: \`gsv-darwin-arm64\`, \`gsvd-darwin-arm64\`, \`gsv-desktop-darwin-arm64\`
          - **macOS (Intel)**: \`gsv-darwin-x64\`, \`gsvd-darwin-x64\`, \`gsv-desktop-darwin-x64\`
          - **Linux (x64)**: \`gsv-linux-x64\`, \`gsvd-linux-x64\`, \`gsv-desktop-linux-x64\`
          - **Linux (ARM64)**: \`gsv-linux-arm64\`, \`gsvd-linux-arm64\`, \`gsv-desktop-linux-arm64\`
          - **Windows (x64)**: \`gsv-windows-x64.exe\`, \`gsvd-windows-x64.exe\`

          The macOS command-line Desktop builds are not yet code-signed or notarized.
          A signed \`.app\` distribution remains blocked on Apple Developer signing
          credentials and a notarization secret being configured for this repository.
          BODY

      - name: Move mutable dev tag
        if: needs.resolve.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          MAIN_SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Refusing to publish stale dev release: main is ${MAIN_SHA}, this run is ${GITHUB_SHA}" >&2
            exit 1
          fi

          if gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api "repos/${REPO}/git/refs/tags/${RELEASE_TAG}" \
              -X PATCH \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api "repos/${REPO}/git/refs" \
              -X POST \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.kind == 'stable' }}
          overwrite_files: true
          append_body: false
          body_path: body.md
          files: |
            release/gsv-linux-x64
            release/gsv-linux-arm64
            release/gsv-darwin-x64
            release/gsv-darwin-arm64
            release/gsv-windows-x64.exe
            release/gsvd-linux-x64
            release/gsvd-linux-arm64
            release/gsvd-darwin-x64
            release/gsvd-darwin-arm64
            release/gsvd-windows-x64.exe
            release/gsv-desktop-linux-x64
            release/gsv-desktop-linux-arm64
            release/gsv-desktop-darwin-x64
            release/gsv-desktop-darwin-arm64
            release/gsv-transcribe-linux-x64
            release/gsv-transcribe-linux-arm64
            release/gsv-transcribe-darwin-x64
            release/gsv-transcribe-darwin-arm64
            release/gsv-transcribe-THIRD_PARTY.md
            release/gsv-cloudflare-*.tar.gz
            release/gsv-cloudflare-deployment-manifest.json
            release/cloudflare-checksums.txt
            release/gsv-browser-extension.zip
            release/install.sh
            release/install.ps1
            release/checksums.txt
