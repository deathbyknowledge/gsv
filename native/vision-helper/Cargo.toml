[package]
name = "gsv-vision"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
crossbeam-channel = "0.5"
font8x8 = "0.3.1"
libloading = "0.8.9"
minifb = "0.28.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-avfoundation"] }

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
