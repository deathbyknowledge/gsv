[package]
name = "gsv-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gsv = { path = "../cli" }
image = "=0.25.10"
markdown = "=1.0.0"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"
usvg = "=0.45.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
