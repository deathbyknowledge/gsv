name = "ripgit"
main = "build/index.js"
compatibility_date = "2026-03-18"
workers_dev = false

[build]
command = "bash ../scripts/worker-build.sh ripgit --release"

[durable_objects]
bindings = [
  { name = "REPOSITORY", class_name = "Repository" },
  { name = "MANAGED_REPOSITORY_REGISTRY", class_name = "ManagedRepositoryRegistry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Repository"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ManagedRepositoryRegistry"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[limits]
cpu_ms = 300_000
